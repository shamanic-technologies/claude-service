name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres owned by the runner: no external database, no secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: claude_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CLAUDE_AGENT_SERVICE_DATABASE_URL: postgresql://test:test@localhost:5432/claude_agent_test
      SERVICE_API_KEY: test-api-key
      ANTHROPIC_API_KEY: test-key

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Replay the migrations exactly as the service does at boot.
      - run: pnpm db:migrate
      - run: pnpm test
